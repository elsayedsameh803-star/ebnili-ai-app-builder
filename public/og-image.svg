<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="إبنيلي — بناء المواقع والتطبيقات بالذكاء الاصطناعي">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Brand glow -->
  <circle cx="140" cy="90" r="220" fill="#f43f5e" opacity="0.16" />
  <circle cx="1080" cy="560" r="200" fill="#f59e0b" opacity="0.12" />

  <!-- Logo mark -->
  <rect x="80" y="80" width="84" height="84" rx="24" fill="url(#brand)" />
  <text x="122" y="140" font-family="system-ui,sans-serif" font-size="46" font-weight="700" fill="#fff" text-anchor="middle">♥</text>

  <text x="190" y="126" font-family="Cairo,system-ui,sans-serif" font-size="40" font-weight="800" fill="#ffffff" direction="rtl">إبنيلي</text>
  <text x="190" y="160" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#94a3b8">Ebnili AI App Builder</text>

  <!-- Headline -->
  <text x="1120" y="290" font-family="Cairo,system-ui,sans-serif" font-size="52" font-weight="800" fill="#ffffff" text-anchor="end" direction="rtl">ابنِ أي موقع أو تطبيق</text>
  <text x="1120" y="360" font-family="Cairo,system-ui,sans-serif" font-size="52" font-weight="800" fill="#ffffff" text-anchor="end" direction="rtl">بالذكاء الاصطناعي خلال ثوانٍ</text>

  <!-- Accent underline -->
  <rect x="880" y="392" width="240" height="6" rx="3" fill="url(#brand)" />

  <!-- Feature pills -->
  <g font-family="Cairo,system-ui,sans-serif" font-size="21" font-weight="700">
    <rect x="796" y="440" width="324" height="46" rx="23" fill="#1e293b" stroke="#334155" />
    <text x="958" y="471" fill="#e2e8f0" text-anchor="middle" direction="rtl">معاينة فورية وتعديل مباشر</text>

    <rect x="900" y="500" width="220" height="46" rx="23" fill="#1e293b" stroke="#334155" />
    <text x="1010" y="531" fill="#e2e8f0" text-anchor="middle" direction="rtl">تصدير ZIP ونشر</text>
  </g>

  <!-- Footer -->
  <text x="1120" y="588" font-family="system-ui,sans-serif" font-size="20" font-weight="600" fill="#64748b" text-anchor="end" direction="rtl">ebnily.vercel.app</text>
</svg>